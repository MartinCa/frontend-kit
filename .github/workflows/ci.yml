name: CI

on:
  # Bare `on: push` plus `on: pull_request` runs this twice for every PR
  # branch. Branch pushes are covered by the pull_request trigger.
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.3"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Code and config are formatted
        run: pnpm format:check

      # Asserts that the shared config's rules actually fire against real
      # fixtures. Checking that `config()` returns an array is also true of a
      # config whose rules never match anything.
      - name: Shared ESLint config behaves
        run: pnpm test

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Manifests are structurally sound
        run: node scripts/validate-manifests.mjs

      # Simulates the release publishing flow (version bump, commit with no-verify,
      # and dry-run pack/publish) to catch release workflow breakages on PRs
      # before tags are created. `--no-git-checks` because `pnpm publish`
      # (unlike `npm publish`) refuses to run off the default branch with a
      # non-clean remote history, which is exactly the situation on a PR branch.
      - name: Simulate release publish flow (dry run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm version "999.999.999" --no-git-tag-version --allow-same-version
          git add package.json
          git commit --no-verify -m "chore: test release [skip ci]"
          pnpm publish --dry-run --ignore-scripts --no-git-checks
        env:
          LEFTHOOK: "0"

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload zizmor's SARIF report to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx zizmor@1.29.0 --format sarif . > zizmor.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
