name: Publish config package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (only used for a manual run; a release's tag is used otherwise)"
        required: false

permissions:
  contents: write # the version-bump commit pushed below
  id-token: write # mints the short-lived OIDC credential npm publishes with

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      # persist-credentials stays true (the default): this job pushes a
      # version-bump commit later in the workflow using the checked-out
      # git credentials, and no artifact upload step exposes the checkout
      # directory, so the credential-persistence risk doesn't apply here.
      - name: Checkout default branch # zizmor: ignore[artipacked] needed for the git push below; no artifacts are uploaded from this checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      # Deliberately no `registry-url`/`scope`: with registry-url set and no
      # NODE_AUTH_TOKEN, setup-node writes an empty `_authToken=` line into
      # .npmrc, npm decides auth is already configured, skips the OIDC exchange
      # and fails with ENEEDAUTH or a 404 (actions/setup-node#1551).
      # registry.npmjs.org is npm's default, so there is nothing to point at.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Trusted publishing needs npm 11.5.1+. Node 24 ships a new enough npm,
      # but a runner image change would otherwise surface as an auth error
      # rather than a version problem.
      - name: npm is new enough for trusted publishing
        run: |
          required=11.5.1
          actual="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is older than $required; trusted publishing will not work." >&2
            exit 1
          fi
          echo "npm $actual"

      # What gets published is the default branch, not the tagged commit, because
      # the bump commit below has to land on a branch. That is only correct when
      # the two are the same commit — a release cut from an older commit would
      # otherwise publish newer code under an older version, silently. Fail
      # instead, and re-cut the release from the branch tip.
      - name: Release tag is the default branch tip
        if: github.event_name == 'release'
        run: |
          tag_sha="$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")"
          head_sha="$(git rev-parse --verify HEAD)"
          if [ "$tag_sha" != "$head_sha" ]; then
            echo "Tag ${TAG_NAME} is at ${tag_sha} but ${DEFAULT_BRANCH} is at ${head_sha}." >&2
            echo "Publishing would ship the branch tip under the tag's version. Re-cut the release from the tip." >&2
            exit 1
          fi
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Resolve version to publish
        id: version
        run: |
          version="${GITHUB_EVENT_INPUTS_VERSION}"
          tag="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          if [ -n "$tag" ]; then
            version="${tag#v}"
          fi
          if [ -z "$version" ]; then
            echo "No version resolved. A release tag or a workflow_dispatch version input is required." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Bump package.json to match and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${STEPS_VERSION_OUTPUTS_VERSION}" --no-git-tag-version --allow-same-version
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit --no-verify -m "chore: release v${STEPS_VERSION_OUTPUTS_VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH}"
          fi
        env:
          LEFTHOOK: "0"
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # No token: npm exchanges the Actions OIDC token for a short-lived,
      # workflow-scoped credential. Provenance is attested automatically under
      # trusted publishing, so --provenance is not needed either.
      #
      # This only works once a trusted publisher is configured for the package
      # at npmjs.com, and that cannot be done before the package exists — the
      # first version had to be published manually with a token. See Part 2 of
      # SETUP.md.
      - run: npm publish --ignore-scripts
