name: Publish config package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (only used for a manual run; a release's tag is used otherwise)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      # persist-credentials stays true (the default): this job pushes a
      # version-bump commit later in the workflow using the checked-out
      # git credentials, and no artifact upload step exposes the checkout
      # directory, so the credential-persistence risk doesn't apply here.
      - name: Checkout default branch # zizmor: ignore[artipacked] needed for the git push below; no artifacts are uploaded from this checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@martinca"
          package-manager-cache: false

      - name: Resolve version to publish
        id: version
        run: |
          version="${GITHUB_EVENT_INPUTS_VERSION}"
          tag="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          if [ -n "$tag" ]; then
            version="${tag#v}"
          fi
          if [ -z "$version" ]; then
            echo "No version resolved. A release tag or a workflow_dispatch version input is required." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Bump package.json to match and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${STEPS_VERSION_OUTPUTS_VERSION}" --no-git-tag-version --allow-same-version
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "chore: release v${STEPS_VERSION_OUTPUTS_VERSION} [skip ci]"
            git push origin HEAD:${GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH}
          fi
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # No --provenance: it publishes an attestation to the public Sigstore
      # log and is only supported against the public npm registry, not
      # GitHub Packages. Nothing to add here if this package ever moves to
      # registry.npmjs.org — just add the flag back and grant
      # `id-token: write` above.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
