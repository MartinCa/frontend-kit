name: Publish config package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (only used for a manual run; a release's tag is used otherwise)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@martinca"

      - name: Resolve version to publish
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          tag="${{ github.event.release.tag_name }}"
          if [ -n "$tag" ]; then
            version="${tag#v}"
          fi
          if [ -z "$version" ]; then
            echo "No version resolved. A release tag or a workflow_dispatch version input is required." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump package.json to match and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
