name: Publish config package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (only used for a manual run; a release's tag is used otherwise)"
        required: false

permissions:
  # The version-bump push no longer uses GITHUB_TOKEN (the main ruleset blocks
  # it); that push authenticates as the VERSION_BUMP App below, so the workflow
  # token only needs read for the checkout.
  contents: read
  id-token: write # mints the short-lived OIDC credential the workflow publishes with

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      # persist-credentials stays true (the default): no artifact upload step
      # exposes the checkout directory, so the credential-persistence risk
      # doesn't apply here. The version-bump push later in this workflow does
      # NOT use these persisted credentials — it replaces them with the
      # VERSION_BUMP App's installation token (see below).
      - name: Checkout default branch # zizmor: ignore[artipacked] needed for the git push below; no artifacts are uploaded from this checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Deliberately no `registry-url`/`scope`: with those set and no
      # NODE_AUTH_TOKEN, setup-node writes an empty `_authToken=` line into
      # .npmrc. Under npm that disables OIDC entirely — npm concludes auth is
      # already configured, skips the exchange, and fails with ENEEDAUTH or a
      # 404 (actions/setup-node#1551). pnpm's native publish does not share
      # that failure mode: it runs the OIDC exchange first and it takes
      # precedence over any configured static token, and an unresolved
      # `${NODE_AUTH_TOKEN}` placeholder resolves to "" instead of being sent
      # literally (pnpm#11513). registry.npmjs.org is the default anyway, so
      # there is still nothing to point at — omitting the option also keeps an
      # empty fallback credential from hiding a genuine auth error if the
      # exchange does fail.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          # No pnpm store cache on release-triggered runs: a poisoned cache would
          # feed the published artifact, and a rare release gains little
          # from caching anyway (zizmor: cache-poisoning).
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) is implemented natively in pnpm since v11
      # (`pnpm publish` no longer delegates to npm). The version is pinned via
      # package.json's `packageManager` field and installed by pnpm/action-setup
      # above, so this guard only protects against that pin regressing below the
      # line that can run the OIDC exchange itself — a runner image change would
      # otherwise surface as an auth error rather than a version problem.
      - name: pnpm is new enough for trusted publishing
        run: |
          required=11.0.0
          actual="$(pnpm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "pnpm $actual is older than $required; trusted publishing will not work." >&2
            exit 1
          fi
          echo "pnpm $actual"

      # What gets published is the default branch, not the tagged commit, because
      # the bump commit below has to land on a branch. That is only correct when
      # the two are the same commit — a release cut from an older commit would
      # otherwise publish newer code under an older version, silently. Fail
      # instead, and re-cut the release from the branch tip.
      - name: Release tag is the default branch tip
        if: github.event_name == 'release'
        run: |
          tag_sha="$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")"
          head_sha="$(git rev-parse --verify HEAD)"
          if [ "$tag_sha" != "$head_sha" ]; then
            echo "Tag ${TAG_NAME} is at ${tag_sha} but ${DEFAULT_BRANCH} is at ${head_sha}." >&2
            echo "Publishing would ship the branch tip under the tag's version. Re-cut the release from the tip." >&2
            exit 1
          fi
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Resolve version to publish
        id: version
        run: |
          version="${GITHUB_EVENT_INPUTS_VERSION}"
          tag="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          if [ -n "$tag" ]; then
            version="${tag#v}"
          fi
          if [ -z "$version" ]; then
            echo "No version resolved. A release tag or a workflow_dispatch version input is required." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      # Mint the VERSION_BUMP GitHub App's installation token for the
      # version-bump push below. The default GITHUB_TOKEN is denied writes to
      # the default branch by the repository's main ruleset; the App is on
      # that ruleset's bypass list, so its token may land the automated bump
      # commit.
      #
      # `client-id` is the action's current identifier input and takes the
      # App's Client ID (the Iv1.… string on the App's General page), stored
      # in VERSION_BUMP_APP_CLIENT_ID; VERSION_BUMP_APP_PRIVATE_KEY holds the
      # App's private key (SETUP.md Part 2).
      # owner/repositories are intentionally left unset, which scopes the token
      # to this repository only, and permission-contents: write is the narrowest
      # permission the push needs. The token is short-lived (1h) and revoked by
      # the action's post step when the job ends, and the action masks it so it
      # cannot appear in logs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.VERSION_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write

      # Authenticate the version-bump push as the VERSION_BUMP App without
      # embedding the installation token in a push URL. The global rewrite
      # maps every https://github.com/ fetch/push to a URL carrying the App
      # token, so the plain `git push origin` below authenticates as the App.
      # The token lives only in this step's env — never in the script text —
      # and the action additionally masks it so it cannot appear in logs. The
      # rewrite is removed in a later step once the push has (or has not)
      # happened.
      - name: Configure git to authenticate as the VERSION_BUMP App
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Bump package.json to match and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm version "${STEPS_VERSION_OUTPUTS_VERSION}" --no-git-tag-version --allow-same-version
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit --no-verify -m "chore: release v${STEPS_VERSION_OUTPUTS_VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH}"
          fi
        env:
          LEFTHOOK: "0"
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # The App's installation token must not outlive the job: remove the
      # rewrite from the runner's global git config now that the bump push is
      # done (or skipped). `always()` so a failed push does not leave the
      # credential behind on the shared runner. The key is given without
      # literal quotes (git parses the subsection unquoted); unsetting a
      # missing key is a no-op.
      - name: Remove the VERSION_BUMP App rewrite from global git config
        if: always()
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global --unset-all "url.https://x-access-token:${APP_TOKEN}@github.com/.insteadOf" || true

      # No token: pnpm exchanges the Actions OIDC token for a short-lived,
      # workflow-scoped credential via the npm registry's OIDC endpoint.
      # Provenance is attached automatically when OIDC is used and the
      # repository is public, so --provenance is not needed either.
      #
      # This only works once a trusted publisher is configured for the package
      # at npmjs.com, and that cannot be done before the package exists — the
      # first version had to be published manually with a token. See Part 2 of
      # SETUP.md.
      - run: pnpm publish --ignore-scripts
