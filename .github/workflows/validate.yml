name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Every registry item resolves to a file that exists
        run: |
          node -e '
            const fs = require("fs");
            const reg = JSON.parse(fs.readFileSync("registry.json", "utf8"));
            let bad = 0;
            for (const item of reg.items) {
              for (const file of item.files ?? []) {
                if (!fs.existsSync(file.path)) {
                  console.error(`missing: ${item.name} -> ${file.path}`);
                  bad++;
                }
              }
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Plugin manifests parse
        run: |
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/marketplace.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("plugins/frontend-conventions/.claude-plugin/plugin.json","utf8"))'

      - name: Shared ESLint config loads
        run: |
          npm install --no-audit --no-fund
          node -e 'import("./eslint.config.js").then(m => { const c = m.default(); if (!Array.isArray(c)) throw new Error("config() did not return an array"); console.log(`ok, ${c.length} config objects`); })'
